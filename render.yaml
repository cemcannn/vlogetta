databases:
  - name: vlogetta
    plan: free
    databaseName: vlogetta
    user: vlogetta

services:
  - type: web
    plan: free
    name: vlogetta-web
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn vlogetta.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vlogetta
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4