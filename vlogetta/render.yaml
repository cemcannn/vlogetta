databases:
  - name: vlogetta
    plan: free
    databaseName: vlogetta
    user: vlogetta

services:
  - type: web
    plan: free
    name: vlogetta-web
    runtime: python
    buildCommand: './build.sh'
  # Use the entrypoint script which will run migrations and create a superuser
  # non-interactively (using env vars) before launching Gunicorn.
  startCommand: './start.sh'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vlogetta
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4